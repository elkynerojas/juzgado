<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Procesos — prueba de concepto</title>
<style>
body{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;margin:0;background:#f4f5f7;color:#1a2230;font-size:14px}
header{background:#1f3864;color:#fff;padding:12px 18px;font-weight:600}
main{max-width:820px;margin:18px auto;padding:0 14px}
.card{background:#fff;border:1px solid #e2e6ec;border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
button{border:1px solid #1f3864;background:#1f3864;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;margin:4px 4px 4px 0}
pre{background:#0f141b;color:#e6eaf0;border-radius:8px;padding:10px;min-height:90px;white-space:pre-wrap;font-size:12px}
.muted{color:#5b6675;font-size:12.5px}
@media print{header,button,pre,.muted{display:none}}
</style>
</head>
<body>
<header>Control de Procesos — Fase 0: prueba de concepto</header>
<main>
  <div class="card"><h2>Entorno</h2><div id="env" class="muted">Detectando…</div></div>
  <div class="card"><h2>1. Impresión / PDF</h2>
    <div class="muted">Hay que confirmar en Windows (WebView2) cuál de estas abre el diálogo de impresión con "Guardar como PDF".</div>
    <button id="pIframe">A. Iframe oculto</button>
    <button id="pOpen">B. window.open</button>
    <button id="pPage">C. window.print() de esta página</button>
    <button id="pNav">D. Abrir en el navegador del sistema</button>
  </div>
  <div class="card"><h2>2. Guardar archivos</h2>
    <button id="sJson">Guardar respaldo .json</button>
    <button id="sCsv">Guardar lista .csv</button>
  </div>
  <div class="card"><h2>Registro</h2><pre id="log"></pre></div>
</main>
<script>
const $=s=>document.querySelector(s);
function log(m){$('#log').textContent+=new Date().toLocaleTimeString()+'  '+m+'\n';}
const nativo=()=>!!(window.pywebview&&window.pywebview.api);

async function guardar(nombre,contenido,tipo,desc){
  if(nativo()){const r=await window.pywebview.api.guardar_texto(nombre,contenido,desc);log(r?'Guardado en '+r:'Guardado cancelado');return;}
  const u=URL.createObjectURL(new Blob([contenido],{type:tipo}));const a=document.createElement('a');a.href=u;a.download=nombre;a.click();URL.revokeObjectURL(u);log('Descarga del navegador: '+nombre);
}

$('#pIframe').onclick=()=>{
  const old=document.getElementById('printFrame');if(old)old.remove();
  const f=document.createElement('iframe');f.id='printFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print();log('A: print() del iframe invocado');}catch(e){log('A: error '+e);}};
  f.src='/spike/doc';document.body.appendChild(f);
};
$('#pOpen').onclick=()=>{let w=null;try{w=window.open('/spike/doc','_blank');}catch(e){log('B: error '+e);}
  if(!w){log('B: window.open bloqueado o no soportado');return;}
  w.addEventListener('load',()=>{try{w.print();log('B: print() de la ventana nueva invocado');}catch(e){log('B: error '+e);}});};
$('#pPage').onclick=()=>{try{window.print();log('C: window.print() invocado');}catch(e){log('C: error '+e);}};
$('#pNav').onclick=async()=>{const url=location.origin+'/spike/doc';
  if(nativo()){await window.pywebview.api.abrir_en_navegador(url);log('D: abierto en el navegador del sistema');}else{window.open(url,'_blank');log('D: sin puente nativo, abierto en pestaña');}};
$('#sJson').onclick=()=>guardar('respaldo_prueba.json',JSON.stringify({procesos:[],actuaciones:[],nota:'áéíóú ñ'},null,2),'application/json','Respaldo JSON (*.json)');
$('#sCsv').onclick=()=>guardar('jornada_prueba.csv','﻿Radicado;Partes;Descripción\n"2019-00327";"Banco c/ González";"Liquidación del crédito"\n','text/csv;charset=utf-8','CSV (*.csv)');

async function env(){
  let s='';try{const r=await fetch('/api/health');s=(await r.json()).status;}catch(e){s='sin respuesta';}
  $('#env').textContent='API: '+s+' · Puente nativo: '+(nativo()?'sí ('+window.pywebview.platform+')':'no (navegador)')+' · '+navigator.userAgent;
}
window.addEventListener('pywebviewready',env);env();
</script>
</body>
</html>
