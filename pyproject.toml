[project]
name = "control-procesos"
version = "1.1"
description = "Control de procesos judiciales: app de escritorio multiusuario en red local"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=6.0",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
control-procesos = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

build = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
