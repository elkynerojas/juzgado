[project]
name = "control-procesos"
version = "0.1.0"
description = "Control de procesos judiciales: app de escritorio multiusuario en red local"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=6.0",
]

[project.scripts]
control-procesos = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
